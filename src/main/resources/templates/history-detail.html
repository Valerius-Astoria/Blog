<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${blog.title} + ' — Valerius'">Post — Valerius</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14201c;
            --ink-muted: #4a5c55;
            --paper: #e8efe9;
            --paper-deep: #d5e2d8;
            --accent: #1f6b4a;
            --line: rgba(20, 32, 28, 0.12);
            --font-display: "Fraunces", Georgia, serif;
            --font-body: "Manrope", sans-serif;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% -10%, #c8ddd0 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #b7cfc4 0%, transparent 50%),
                linear-gradient(165deg, var(--paper) 0%, var(--paper-deep) 100%);
            background-attachment: fixed;
        }

        .page {
            width: min(720px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 3.5rem 0 4.5rem;
            animation: rise 0.7s ease-out both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.35rem;
            margin-bottom: 2rem;
            animation: fade-in 0.7s 0.05s ease-out both;
        }

        .nav a {
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .nav a:hover {
            color: var(--accent);
        }

        .brand {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            margin: 0 0 2rem;
            animation: rise 0.75s 0.08s ease-out both;
        }

        .brand a {
            color: inherit;
            text-decoration: none;
        }

        .brand a:hover {
            color: var(--accent);
        }

        article {
            animation: rise 0.85s 0.15s ease-out both;
        }

        .post-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin: 0 0 0.75rem;
        }

        .post-subtitle {
            margin: 0 0 1rem;
            font-size: 1.15rem;
            line-height: 1.5;
            color: var(--ink-muted);
        }

        .post-meta {
            margin: 0 0 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #7a8f85;
        }

        .post-body {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.75;
            white-space: pre-wrap;
            animation: fade-in 1s 0.28s ease-out both;
        }

        .back {
            display: inline-block;
            margin-top: 2.75rem;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease;
            animation: fade-in 0.9s 0.35s ease-out both;
        }

        .back:hover {
            color: #145038;
            transform: translateX(-3px);
        }

        @media (max-width: 560px) {
            .page { padding-top: 2.25rem; }
        }
    </style>
</head>
<body>
<main class="page">
    <nav class="nav" aria-label="Primary">
        <a th:href="@{/create}">Write</a>
        <a th:href="@{/History}">History</a>
    </nav>

    <p class="brand"><a th:href="@{/History}">Valerius</a></p>

    <article th:object="${blog}">
        <h1 class="post-title" th:text="*{title}">Title</h1>
        <p class="post-subtitle" th:text="*{subTitle}">Subtitle</p>
        <p class="post-meta">
            <time th:datetime="*{createdAt}" th:text="*{createdAt}">Date</time>
        </p>
        <div class="post-body" th:text="*{body}">Body</div>
    </article>

    <a class="back" th:href="@{/History}">← Back to history</a>
</main>
</body>
</html>
