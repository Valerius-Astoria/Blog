<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History — Valerius</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14201c;
            --ink-muted: #4a5c55;
            --paper: #e8efe9;
            --paper-deep: #d5e2d8;
            --field: #f5faf6;
            --accent: #1f6b4a;
            --accent-deep: #145038;
            --line: rgba(20, 32, 28, 0.12);
            --font-display: "Fraunces", Georgia, serif;
            --font-body: "Manrope", sans-serif;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% -10%, #c8ddd0 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #b7cfc4 0%, transparent 50%),
                linear-gradient(165deg, var(--paper) 0%, var(--paper-deep) 100%);
            background-attachment: fixed;
        }

        .page {
            width: min(720px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 3.5rem 0 4.5rem;
            animation: rise 0.7s ease-out both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.35rem;
            margin-bottom: 2rem;
            animation: fade-in 0.7s 0.05s ease-out both;
        }

        .nav a,
        .nav button {
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .nav form {
            display: inline;
            margin: 0;
        }

        .nav button {
            appearance: none;
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
        }

        .nav a:hover,
        .nav a[aria-current="page"],
        .nav button:hover {
            color: var(--accent);
        }

        .brand {
            font-family: var(--font-display);
            font-size: clamp(2.75rem, 8vw, 4.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 0.95;
            margin: 0 0 0.75rem;
            animation: rise 0.8s 0.08s ease-out both;
        }

        .lede {
            margin: 0 0 2.5rem;
            max-width: 28rem;
            font-size: 1.05rem;
            line-height: 1.55;
            color: var(--ink-muted);
            animation: fade-in 0.9s 0.2s ease-out both;
        }

        .archive {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid var(--line);
            animation: rise 0.85s 0.18s ease-out both;
        }

        .archive li {
            border-bottom: 1px solid var(--line);
        }

        .archive a {
            display: grid;
            gap: 0.35rem;
            padding: 1.35rem 0.15rem;
            color: inherit;
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .archive a:hover {
            transform: translateX(4px);
            color: var(--accent-deep);
        }

        .archive a:hover .post-title {
            color: var(--accent);
        }

        .post-title {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 3vw, 1.7rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin: 0;
            transition: color 0.2s ease;
        }

        .post-subtitle {
            margin: 0;
            color: var(--ink-muted);
            line-height: 1.45;
        }

        .post-meta {
            margin: 0.15rem 0 0;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #7a8f85;
        }

        .empty {
            margin: 0;
            padding: 1.5rem 0;
            color: var(--ink-muted);
            line-height: 1.55;
            border-top: 1px solid var(--line);
            animation: rise 0.85s 0.18s ease-out both;
        }

        .empty a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .empty a:hover {
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            .page { padding-top: 2.25rem; }
        }
    </style>
</head>
<body>
<main class="page">
    <nav class="nav" aria-label="Primary">
        <a th:href="@{/create}">Write</a>
        <a th:href="@{/history}" aria-current="page">History</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sign out</button>
        </form>
    </nav>

    <h1 class="brand">Valerius</h1>
    <p class="lede">Your published posts. Open any entry to read the full piece.</p>

    <p class="empty" th:if="${#lists.isEmpty(blogs)}">
        No posts yet.
        <a th:href="@{/create}">Write your first one</a>.
    </p>

    <ul class="archive" th:if="${!#lists.isEmpty(blogs)}">
        <li th:each="post : ${blogs}">
            <a th:href="@{/history/{id}(id=${post.id})}">
                <h2 class="post-title" th:text="${post.title}">Title</h2>
                <p class="post-subtitle" th:text="${post.subTitle}">Subtitle</p>
                <p class="post-meta">
                    <time th:datetime="${post.createdAt}"
                          th:text="${post.createdAt}">Date</time>
                </p>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
