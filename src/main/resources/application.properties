spring.application.name=Blog
app.remember-me-key=${REMEMBER_ME_KEY:blog-dev-key}

# Optional local secrets (gitignored). On Render, set SPRING_DATASOURCE_URL /
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD instead.
spring.config.import=optional:classpath:application-local.properties

# Render (and other reverse proxies) terminate TLS. Honor X-Forwarded-*
# so secure cookies use https.
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OAuth2 clients. Set these environment variables to the credentials from the
# provider consoles. The callback URL registered with each provider is
# {baseUrl}/login/oauth2/code/{registrationId}.
# The fallback keeps non-production environments bootable. The provider will
# reject it, so set both variables before exposing the social-login buttons.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unused}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unused}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:unused}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:unused}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
