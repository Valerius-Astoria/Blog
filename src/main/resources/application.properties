spring.application.name=Blog
app.remember-me-key=${REMEMBER_ME_KEY:blog-dev-key}

# Optional local secrets (gitignored). On Render, set SPRING_DATASOURCE_URL /
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD instead.
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OAuth2 clients — set real values via env vars before using social login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unused}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unused}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:unused}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:unused}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
