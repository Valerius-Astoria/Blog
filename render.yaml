services:
  - type: web
    name: valerius-blog
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: REMEMBER_ME_KEY
        sync: false
