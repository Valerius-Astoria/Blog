<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — Valerius</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14201c;
            --ink-muted: #4a5c55;
            --paper: #e8efe9;
            --paper-deep: #d5e2d8;
            --field: #f5faf6;
            --accent: #1f6b4a;
            --accent-deep: #145038;
            --danger: #9b2c2c;
            --line: rgba(20, 32, 28, 0.12);
            --shadow: 0 18px 50px rgba(20, 32, 28, 0.08);
            --radius: 14px;
            --font-display: "Fraunces", Georgia, serif;
            --font-body: "Manrope", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% -10%, #c8ddd0 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #b7cfc4 0%, transparent 50%),
                linear-gradient(165deg, var(--paper) 0%, var(--paper-deep) 100%);
            background-attachment: fixed;
        }

        .page {
            width: min(440px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 3.5rem 0 4.5rem;
            animation: rise 0.7s ease-out both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .brand {
            font-family: var(--font-display);
            font-size: clamp(2.75rem, 8vw, 4.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 0.95;
            margin: 0 0 0.75rem;
            animation: rise 0.8s 0.08s ease-out both;
        }

        .lede {
            margin: 0 0 2.5rem;
            max-width: 22rem;
            font-size: 1.05rem;
            line-height: 1.55;
            color: var(--ink-muted);
            animation: fade-in 0.9s 0.2s ease-out both;
        }

        form {
            display: grid;
            gap: 1.35rem;
            animation: rise 0.85s 0.18s ease-out both;
        }

        .field {
            display: grid;
            gap: 0.45rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        input {
            width: 100%;
            margin: 0;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--field);
            color: var(--ink);
            font: inherit;
            padding: 0.95rem 1.1rem;
            box-shadow: var(--shadow);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(31, 107, 74, 0.18), var(--shadow);
            transform: translateY(-1px);
        }

        input::placeholder {
            color: #7a8f85;
        }

        .error {
            margin: 0;
            font-size: 0.875rem;
            color: var(--danger);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1.25rem;
            margin-top: 0.35rem;
        }

        button[type="submit"] {
            appearance: none;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: #f4faf6;
            font: inherit;
            font-weight: 700;
            letter-spacing: 0.01em;
            padding: 0.95rem 1.6rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(31, 107, 74, 0.28);
        }

        button[type="submit"]:hover {
            background: var(--accent-deep);
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .oauth {
            margin-top: 2rem;
            display: grid;
            gap: 0.85rem;
            animation: rise 0.85s 0.26s ease-out both;
        }

        .oauth-divider {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 0.85rem;
            margin: 0 0 0.15rem;
            color: var(--ink-muted);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: "";
            height: 1px;
            background: var(--line);
        }

        .oauth-links {
            display: grid;
            gap: 0.75rem;
        }

        .oauth-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            padding: 0.9rem 1.1rem;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--field);
            color: var(--ink);
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .oauth-link:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 0 0 3px rgba(31, 107, 74, 0.12), var(--shadow);
        }

        .oauth-link:active {
            transform: translateY(0);
        }

        .oauth-link svg {
            width: 1.15rem;
            height: 1.15rem;
            flex-shrink: 0;
        }

        .footer-note {
            margin: 2rem 0 0;
            font-size: 0.95rem;
            color: var(--ink-muted);
            animation: fade-in 0.9s 0.3s ease-out both;
        }

        .footer-note a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            .page {
                padding-top: 2.25rem;
            }

            button[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <h1 class="brand">Valerius</h1>
    <p class="lede">Create an account to write and keep your posts.</p>

    <form th:action="@{/register}" th:object="${registrationForm}" method="post">
        <div class="field">
            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   placeholder="you@example.com"
                   required
                   autocomplete="email">
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   th:field="*{password}"
                   placeholder="Choose a password"
                   required
                   autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="actions">
            <button type="submit">Create account</button>
        </div>
    </form>

    <div class="oauth">
        <p class="oauth-divider">Or continue with</p>
        <div class="oauth-links">
            <a class="oauth-link" th:href="@{/oauth2/authorization/google}">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </a>
            <a class="oauth-link" th:href="@{/oauth2/authorization/github}">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 1.5C6.2 1.5 1.5 6.2 1.5 12c0 4.64 3.01 8.57 7.19 9.96.53.1.72-.23.72-.51 0-.25-.01-.91-.01-1.79-2.92.63-3.54-1.41-3.54-1.41-.48-1.21-1.17-1.53-1.17-1.53-.96-.65.07-.64.07-.64 1.06.07 1.62 1.09 1.62 1.09.94 1.61 2.47 1.15 3.07.88.1-.68.37-1.15.67-1.41-2.33-.27-4.78-1.17-4.78-5.19 0-1.15.41-2.09 1.09-2.82-.11-.27-.47-1.35.1-2.81 0 0 .89-.28 2.91 1.08A10.1 10.1 0 0 1 12 6.84c.9 0 1.81.12 2.66.35 2.02-1.36 2.91-1.08 2.91-1.08.57 1.46.21 2.54.1 2.81.68.73 1.09 1.67 1.09 2.82 0 4.03-2.46 4.92-4.8 5.18.38.33.72.97.72 1.96 0 1.41-.01 2.55-.01 2.9 0 .28.19.62.73.51A10.52 10.52 0 0 0 22.5 12C22.5 6.2 17.8 1.5 12 1.5z"/>
                </svg>
                Continue with GitHub
            </a>
        </div>
    </div>

    <p class="footer-note">
        Already have an account?
        <a th:href="@{/login}">Sign in</a>
    </p>
</main>
</body>
</html>
