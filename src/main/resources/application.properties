spring.application.name=Blog
app.remember-me-key=${REMEMBER_ME_KEY:blog-dev-key}

# Optional local secrets (gitignored). On Render, set SPRING_DATASOURCE_URL /
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD instead.
spring.config.import=optional:classpath:application-local.properties

# Render (and other reverse proxies) terminate TLS. Honor X-Forwarded-*
# so secure cookies use https.
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
