<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New post — Valerius</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14201c;
            --ink-muted: #4a5c55;
            --paper: #e8efe9;
            --paper-deep: #d5e2d8;
            --field: #f5faf6;
            --accent: #1f6b4a;
            --accent-deep: #145038;
            --danger: #9b2c2c;
            --line: rgba(20, 32, 28, 0.12);
            --shadow: 0 18px 50px rgba(20, 32, 28, 0.08);
            --radius: 14px;
            --font-display: "Fraunces", Georgia, serif;
            --font-body: "Manrope", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% -10%, #c8ddd0 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #b7cfc4 0%, transparent 50%),
                linear-gradient(165deg, var(--paper) 0%, var(--paper-deep) 100%);
            background-attachment: fixed;
        }

        .page {
            width: min(720px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 3.5rem 0 4.5rem;
            animation: rise 0.7s ease-out both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.35rem;
            margin-bottom: 2rem;
            animation: fade-in 0.7s 0.05s ease-out both;
        }

        .nav a,
        .nav button {
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .nav form {
            display: inline;
            margin: 0;
            padding: 0;
            gap: 0;
            animation: none;
        }

        .nav button {
            appearance: none;
            border: 0;
            border-radius: 0;
            background: none;
            padding: 0;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--ink-muted);
            cursor: pointer;
            box-shadow: none;
            transform: none;
        }

        .nav button:hover,
        .nav button:active {
            background: none;
            transform: none;
            box-shadow: none;
            color: var(--accent);
        }

        .nav a:hover,
        .nav a[aria-current="page"] {
            color: var(--accent);
        }

        .brand {
            font-family: var(--font-display);
            font-size: clamp(2.75rem, 8vw, 4.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 0.95;
            margin: 0 0 0.75rem;
            animation: rise 0.8s 0.08s ease-out both;
        }

        .lede {
            margin: 0 0 2.5rem;
            max-width: 28rem;
            font-size: 1.05rem;
            line-height: 1.55;
            color: var(--ink-muted);
            animation: fade-in 0.9s 0.2s ease-out both;
        }

        form {
            display: grid;
            gap: 1.35rem;
            animation: rise 0.85s 0.18s ease-out both;
        }

        .field {
            display: grid;
            gap: 0.45rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        input,
        textarea {
            width: 100%;
            margin: 0;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--field);
            color: var(--ink);
            font: inherit;
            padding: 0.95rem 1.1rem;
            box-shadow: var(--shadow);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(31, 107, 74, 0.18), var(--shadow);
            transform: translateY(-1px);
        }

        input::placeholder,
        textarea::placeholder {
            color: #7a8f85;
        }

        input.title-input {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 3.5vw, 1.75rem);
            font-weight: 500;
            padding-block: 1.1rem;
        }

        textarea {
            min-height: 16rem;
            resize: vertical;
            line-height: 1.65;
        }

        .error {
            margin: 0;
            font-size: 0.875rem;
            color: var(--danger);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.35rem;
        }

        .actions button[type="submit"] {
            appearance: none;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: #f4faf6;
            font: inherit;
            font-weight: 700;
            letter-spacing: 0.01em;
            padding: 0.95rem 1.6rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(31, 107, 74, 0.28);
        }

        .actions button[type="submit"]:hover {
            background: var(--accent-deep);
            transform: translateY(-2px);
        }

        .actions button[type="submit"]:active {
            transform: translateY(0);
        }

        @media (max-width: 560px) {
            .page {
                padding-top: 2.25rem;
            }

            textarea {
                min-height: 12rem;
            }

            .actions button[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <nav class="nav" aria-label="Primary">
        <a th:href="@{/create}" aria-current="page">Write</a>
        <a th:href="@{/history}">History</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sign out</button>
        </form>
    </nav>

    <h1 class="brand">Valerius</h1>
    <p class="lede">Write a new post. Title, subtitle, and body are saved when you publish.</p>

    <form th:action="@{/create}" th:object="${blog}" method="post">
        <div class="field">
            <label for="title">Title</label>
            <input id="title"
                   class="title-input"
                   type="text"
                   th:field="*{title}"
                   placeholder="Give the post a clear headline"
                   required
                   autocomplete="off">
            <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="field">
            <label for="subTitle">Subtitle</label>
            <input id="subTitle"
                   type="text"
                   th:field="*{subTitle}"
                   placeholder="A short line under the title"
                   required
                   autocomplete="off">
            <p class="error" th:if="${#fields.hasErrors('subTitle')}" th:errors="*{subTitle}"></p>
        </div>

        <div class="field">
            <label for="body">Body</label>
            <textarea id="body"
                      th:field="*{body}"
                      placeholder="Write the full post here"
                      required></textarea>
            <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></p>
        </div>

        <div class="actions">
            <button type="submit">Publish post</button>
        </div>
    </form>
</main>
</body>
</html>
